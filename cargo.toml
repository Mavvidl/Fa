[package]
name = "fafs"
version = "0.1.0"
edition = "2024"
authors = ["FaFs Development Team"]
description = "A cross-platform fractal-based file system"
license = "MIT"

[lib]
name = "fafs"
path = "src/lib.rs"

[[bin]]
name = "fafs"
path = "src/main.rs"

[dependencies]
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[features]
default = ["backend-memory"]

backend-memory = []
backend-windows = []
backend-linux = []
backend-macos = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
